<!doctype html>
<html lang="en">
  <head>
    <title>Milingo</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="header">
      <div class="settings-wrapper">
        <button class="settings-btn">
          <svg
            width="18"
            height="18"
            viewBox="0 0 18 18"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <line
              x1="2"
              y1="4"
              x2="16"
              y2="4"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
            <line
              x1="2"
              y1="9"
              x2="16"
              y2="9"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
            <line
              x1="2"
              y1="14"
              x2="16"
              y2="14"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <div class="dropdown" id="menu">
          <div class="dropdown-item">Profile</div>
          <div class="dropdown-item">History</div>
          <div class="dropdown-item">Settings</div>
        </div>
      </div>
      <h1>Milingo</h1>
      <button class="profile-btn">
        <img class="profile-icon" src="assets/miloBot.png" />
      </button>
    </div>
    <div class="lang-selector-container">
      <button id="arab-btn">🇸🇦Arabic</button>
      <button id="jap-btn">🇯🇵Japanese</button>
      <button id="esp-btn">🇪🇸Spanish</button>
    </div>

    <div class="translate-container">
      <form id="translate-form" class="translate-form">
        <div class="input-container">
          <textarea
            id="user-input"
            placeholder="Milo is here to assist!"
          ></textarea>
        </div>

        <div class="btn-container">
          <button type="submit" id="translate-btn" class="translate-btn">
            ✨Translate
          </button>
        </div>

        <div class="output-container" id="output-container"></div>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <script type="module" src="dropdown.js"></script>
    <script type="module" src="index.js"></script>
  </body>
</html>
