<!doctype html>
<html lang="en">
  <head>
    <title>Milingo</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="lang-selector-container">
      <button class="arab-btn">🇸🇦Arabic</button>
      <button class="jap-btn">🇯🇵Japanese</button>
      <button class="esp-btn">🇪🇸Spanish</button>
    </div>

    <div class="translate-container">
      <form id="translate-form" class="translate-form">
        <div class="input-container">
          <textarea
            id="user-input"
            placeholder="Milo is here to assist!"
          ></textarea>
        </div>

        <div class="btn-container">
          <button type="submit" id="translate-btn" class="translate-btn">
            ✨Translate
          </button>
        </div>

        <div class="output-container"></div>
      </form>
    </div>

    <script type="module" src="index.js"></script>
  </body>
</html>
